name: original-chrome-default
version: 0.11.3
manifest_version: 2
api_version: 1
homepage: https://github.com/dhansxd/hermes-original-chrome-cdp
description: Use original, signed-in Chrome through native Hermes browser tools, with separate agent windows via CDP.
author: dhansxd
license: MIT
kind: backend
capabilities:
  - tools.override
provides_browser_providers:
  - original-chrome-default
provides_tools:
  - browser_exec
  - chrome_profiles
provides_middleware:
  - llm_execution
provides_hooks:
  - pre_tool_call
  - agent_loop_stopped
  - on_session_finalize
  - on_session_end
  - subagent_start
  - on_human_input_request
  - on_human_input_resolved
config_schema:
  handoff_mode:
    type: dict
    default: {}
    description: Choose manual or automatic continuation for packages that declare a handoff mode.
  rolling_profiles:
    type: dict
    default: {}
    description: Chrome directory order for automatic handoff. Packages with no handoff mode also try other current profiles.
  apps_disabled:
    type: dict
    default: {}
    description: Persistent disabled or removed website package IDs.
  profile_rules:
    type: dict
    default: {}
    description: Profile policies managed with chrome_profiles set_rule and clear_rule.
  apps_directory:
    type: str
    default: ''
    description: User-owned site packages directory. Empty uses browser-apps under the active Hermes profile.
  profile_directory:
    type: str
    default: Default
    description: Default original Chrome profile directory for new sessions. Use chrome_profiles to list profiles or choose a different profile per session.
python_dependencies:
  - psutil>=5.9,<8; sys_platform == 'darwin'
  - websockets>=15,<17; sys_platform == 'darwin'
