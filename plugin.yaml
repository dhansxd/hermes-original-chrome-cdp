name: original-chrome-default
version: 0.5.1
manifest_version: 2
api_version: 1
homepage: https://github.com/dhansxd/hermes-original-chrome-cdp
description: Use original, signed-in Chrome through native Hermes browser tools, with separate agent windows via CDP.
author: dhansxd
license: MIT
kind: backend
capabilities: []
provides_browser_providers:
  - original-chrome-default
provides_tools:
  - chrome_profiles
provides_hooks:
  - pre_tool_call
  - agent_loop_stopped
  - on_session_finalize
  - on_session_end
  - on_human_input_request
  - on_human_input_resolved
config_schema:
  profile_directory:
    type: str
    default: Default
    description: Default original Chrome profile directory for new sessions. Use chrome_profiles to list profiles or choose a different profile per session.
python_dependencies:
  - psutil>=5.9,<8; sys_platform == 'darwin'
  - websockets>=15,<17; sys_platform == 'darwin'
