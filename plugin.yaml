name: original-chrome-default
version: 0.4.4
manifest_version: 2
api_version: 1
homepage: https://github.com/dhansxd/hermes-original-chrome-default-plugin
description: Use original, signed-in Chrome through native Hermes browser tools, with separate agent windows via CDP.
author: dhansxd
license: MIT
kind: backend
capabilities: []
provides_browser_providers:
  - original-chrome-default
provides_hooks:
  - pre_tool_call
  - agent_loop_stopped
  - on_session_finalize
  - on_session_end
  - on_human_input_request
  - on_human_input_resolved
config_schema:
  profile_directory:
    type: str
    default: Default
    description: Existing directory in original Chrome user data, such as Default or Profile 2. No profile is copied.
python_dependencies:
  - psutil>=5.9,<8
  - websockets>=15,<17
